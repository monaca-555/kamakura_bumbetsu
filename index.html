<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<title>鎌倉ごみ分別さがし</title>
<meta name="description" content="鎌倉市の資源物・ごみ分別ガイド（50音順索引）を品名検索できる非公式ツール">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>鎌倉ごみ分別さがし</h1>
  <p class="subtitle">鎌倉市配布冊子より 品目の分別区分を検索（非公式）</p>
</header>

<main>
  <div class="search-wrap">
    <input
      id="search"
      type="search"
      inputmode="search"
      placeholder="品名を入力（例：スプレー缶、傘、ペットボトル）"
      autocomplete="off"
      autofocus
    >
    <button id="clear-btn" type="button" aria-label="クリア" hidden>&times;</button>
  </div>

  <div class="filter-row" id="filter-row" aria-label="区分で絞り込み"></div>

  <p class="result-count" id="result-count" aria-live="polite"></p>

  <ul id="results" class="results"></ul>

  <p id="empty-state" class="empty-state" hidden>
    該当する品目が見つかりませんでした。<br>
    別のキーワードで試すか、記載のない品目は鎌倉市ごみ対策課へお問い合わせください。
  </p>
</main>

<footer class="app-footer">
  <p>
    出典：鎌倉市「資源物とごみの品目と分別区分（50音順索引）」<br>
    このサイトは個人が作成した非公式ツールです。最新の情報は必ず
    <a href="https://www.city.kamakura.kanagawa.jp/" target="_blank" rel="noopener">鎌倉市公式サイト</a>
    でご確認ください。記載のない品目・不明点は市のごみ対策課へお問い合わせください。
  </p>
</footer>

<div id="detail-sheet" class="sheet" hidden>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet-content" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="sheet-close" id="sheet-close" aria-label="閉じる">&times;</button>
    <h2 id="sheet-title"></h2>
    <p class="sheet-category"><span id="sheet-cat-chip" class="chip"></span><span id="sheet-cat-sub"></span></p>
    <p class="sheet-note" id="sheet-note"></p>
    <p class="sheet-page" id="sheet-page"></p>
  </div>
</div>

<script src="data/items.js"></script>
<script src="js/app.js"></script>
</body>
</html>
